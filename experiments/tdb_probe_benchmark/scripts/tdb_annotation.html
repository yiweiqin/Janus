<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDB 人工审核</title><style>body{margin:0;background:#f4f6fb;color:#172033;font:14px system-ui}header{padding:22px 28px;background:#101a33;color:white}main{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:20px;max-width:1400px;margin:auto}.panel,.card{background:white;border:1px solid #dfe5f0;border-radius:14px;padding:16px;box-shadow:0 6px 20px #13234d0b}.item{padding:12px;border-bottom:1px solid #edf0f6;cursor:pointer}.item.active{background:#eaf0ff;border-radius:10px}.muted{color:#67738a}.chat{max-height:310px;overflow:auto;background:#f8faff;padding:12px;border-radius:10px}.msg{margin:8px 0;padding:9px;border-radius:9px;background:white}.msg b{color:#315ddc}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;font-weight:600;margin:10px 0 5px}input,textarea,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cfd7e6;border-radius:8px}button{background:#315ddc;color:#fff;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}.badge{display:inline-block;background:#fff0c2;padding:3px 7px;border-radius:99px;font-size:12px}@media(max-width:850px){main{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style><header><strong>TDB 双智能体训练数据审核</strong><div class="muted" style="color:#b9c6e6">审核完整双智能体会话、依赖证据、最小披露和协同进化优先级。提交后由独立规则合并。</div></header><main><section class="panel"><div id="summary">加载中优先级…</div><div id="list"></div></section><section id="detail" class="card">请从左侧选择一条 episode</section></main><script>let rows=[],selected=null;const familyNames={ledger_reconciliation:'账本对账',dependency_order:'依赖顺序',deliverable_review:'交付物审核',authorized_projection:'授权信息披露'};const targetNames={dependency:'依赖评分',disclosure:'信息披露',evolution:'协同进化'};async function load(){let r=await fetch('/api/queue');rows=(await r.json()).rows;document.querySelector('#summary').innerHTML=`待审核 ${rows.filter(x=>x.status==='pending').length} 条 / 共 ${rows.length} 条`;document.querySelector('#list').innerHTML=rows.map((x,i)=>`<button type="button" class="item ${selected===i?'active':''}" onclick="pick(${i})" style="display:block;width:100%;text-align:left;background:white;color:#172033"><b>${x.episode.episodeId}</b><br><span class="muted">${familyNames[x.episode.taskFamilyId]||x.episode.taskFamilyId}</span><br><span class="badge">${x.reviewTargets.map(t=>targetNames[t]||t).join(' · ')}</span></button>`).join('');if(selected!==null)render()}function pick(i){selected=i;load()}function render(){let e=rows[selected].episode;let block=(title,obj)=>`<details><summary><b>${title}</b></summary><pre style="white-space:pre-wrap;max-height:240px;overflow:auto">${esc(JSON.stringify(obj||{},null,2))}</pre></details>`;document.querySelector('#detail').innerHTML=`<h2>${e.episodeId}</h2><p class="muted">任务族：${familyNames[e.taskFamilyId]||e.taskFamilyId} · 接收者决策：${e.decisionQuery}</p><h3>完整双智能体会话</h3><div class="chat">${e.conversation.map(m=>`<div class="msg"><b>${m.role} / ${m.actorUserId}</b>　<span class="muted">${m.occurredAt||''}</span><br>${esc(m.content||'')}</div>`).join('')}</div>${block("任务事件轨迹",e.eventTrace)}${block("工具调用与结果",e.toolTrace)}${block("TDB 计划 / 活跃 / 执行状态",{tdbPlan:e.tdbPlan,tdbActiveTrace:e.tdbActiveTrace,tdbExec:e.tdbExec})}${block("组织图：计划 G_plan / 执行 G_exec",{gPlan:e.gPlan,gExec:e.gExec})}${block("权限、隐私、来源与哈希",{receiverScope:e.receiverScope,privacyPolicy:e.privacyPolicy,hardContract:e.hardContract,sourceProvenance:e.sourceProvenance,replayToken:e.replayToken,traceHash:e.traceHash,snapshotHash:e.snapshotHash})}<h3>模型预标注草稿</h3><div class="badge">Astra 建议不能直接认证</div><pre style="white-space:pre-wrap;max-height:260px;overflow:auto;background:#fffaf0;padding:10px">${esc(JSON.stringify({proposal:e.modelProposal||{},checker:e.checker||{}},null,2))}</pre><button type="button" onclick="applyDraft()">一键接受本条草稿</button><p class="muted">接受后仍须由两名审核人分别提交；可继续修改或标记 UNKNOWN / CONFLICT。</p><h3>人工审核标注</h3><label>审核人（姓名或工号）<input id="reviewer" placeholder="姓名或工号"></label><h4>依赖维度（0–1；无法判断（UNKNOWN）请留空）</h4><div class="grid">${['data','logic','quality','freshness','review','capability','resource','risk','downstreamImpact','uncertainty'].map(d=>`<label>${d}<input id="dim_${d}" type="number" min="0" max="1" step="0.01" placeholder="UNKNOWN"></label>`).join('')}</div><label>候选依赖边 ID<input id="edge" placeholder="edge id"></label><div class="grid"><div><label>信息披露状态<select id="ds"><option value="sufficient">充分，足以决策</option><option value="insufficient">不足，需要更多信息</option><option value="unknown">无法判断（UNKNOWN）</option></select></label></div><div><label>协同进化优先级<select id="es"><option value="high">高优先级</option><option value="medium">中优先级</option><option value="low">低优先级</option><option value="unknown">无法判断（UNKNOWN）</option></select></label></div><div><label>证据质量判断<select id="ev"><option value="supported">证据支持</option><option value="conflict">证据冲突</option><option value="missing">证据缺失</option></select></label></div></div><label>最小披露字段（用逗号分隔）<input id="units" placeholder="tdb.logic, result.version"></label><label>披露成本（字段数或估计成本）<input id="dcost" type="number" min="0" step="0.01" placeholder="UNKNOWN"></label><label>最小可执行步骤（每行一步）<textarea id="steps" rows="3" placeholder="例如：恢复一次结构化交接"></textarea></label><label>优先级因素 JSON（影响、不确定性、风险、耦合、可修复性、成本）<input id="factors" placeholder="{&quot;impact&quot;:0.8,&quot;cost&quot;:1}"></label><label>审核备注<textarea id="note" rows="3"></textarea></label><button onclick="submitReview()">提交本条审核</button><p id="result"></p>`}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function applyDraft(){let e=rows[selected].episode,d=e.modelProposal||{},dep=d.dependencyProposal||{},dims=dep.dimensions||{};Object.entries(dims).forEach(([k,v])=>{let x=document.getElementById('dim_'+k);if(x&&v.value!=null)x.value=v.value});let ds=d.disclosureProposal||{},ev=d.evolutionProposal||{};if(ds.selectedUnits)document.getElementById('units').value=ds.selectedUnits.join(', ');if(ds.disclosureCost!=null)document.getElementById('dcost').value=ds.disclosureCost;if(ev.orderedSteps)document.getElementById('steps').value=ev.orderedSteps.join('\n');if(ev.candidateEdgeId)document.getElementById('edge').value=ev.candidateEdgeId;document.getElementById('note').value='已载入 Astra 草稿，可修改后提交。';}
async function submitReview(){let e=rows[selected].episode;let dims={};['data','logic','quality','freshness','review','capability','resource','risk','downstreamImpact','uncertainty'].forEach(d=>{let v=document.querySelector('#dim_'+d).value;if(v!=='')dims[d]={mean:Number(v),status:'HUMAN_REVIEWED',label_mask:true}});let review={dependency:{candidateEdgeId:document.getElementById('edge').value,dimensions:dims},disclosure:{status:document.getElementById('ds').value,selectedUnits:document.getElementById('units').value.split(',').map(x=>x.trim()).filter(Boolean),disclosureCost:document.getElementById('dcost').value===''?null:Number(document.getElementById('dcost').value)},evolution:{priority:document.getElementById('es').value,orderedSteps:document.getElementById('steps').value.split('\\n').map(x=>x.trim()).filter(Boolean),factors:(()=>{try{return JSON.parse(document.getElementById('factors').value||'{}')}catch{return {parseError:true}}})()},evidenceQuality:document.getElementById('ev').value,note:document.getElementById('note').value};let r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({episodeId:e.episodeId,reviewer:document.getElementById('reviewer').value,review})});document.querySelector('#result').textContent=r.ok?'已保存':'保存失败，请检查审核人和网络连接';load()}load()</script></html>
