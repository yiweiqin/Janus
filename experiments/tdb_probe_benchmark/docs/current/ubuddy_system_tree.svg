<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2200" viewBox="0 0 1800 2200"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><rect x="520" y="30" width="760" height="120" rx="18" fill="#102A43" stroke="#63B3ED" stroke-width="4"/><text x="900.0" y="68" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">uBuddy 总体目标</text><text x="542" y="105" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">跨人、跨组织、多 Agent 协作</text><text x="542" y="132" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">只披露足以支持决策的信息</text><text x="542" y="159" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">基于可追溯证据实现联合进化</text><rect x="610" y="190" width="580" height="90" rx="18" fill="#542C36" stroke="#F56565" stroke-width="4"/><text x="900.0" y="228" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">三类核心痛点</text><text x="632" y="265" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">可见性悖论　·　公共状态不充分　·　结果因果归因困难</text><line x1="900" y1="150" x2="900" y2="190" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="40" y="350" width="400" height="150" rx="18" fill="#243B72" stroke="#7AA2F7" stroke-width="4"/><text x="240.0" y="388" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">模块一：协作世界建模</text><text x="62" y="425" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">公共/私人空间</text><text x="62" y="452" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">G_plan / G_exec</text><text x="62" y="479" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">关系边、权限、责任</text><text x="62" y="506" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">有限协作世界目录 W</text><rect x="470" y="350" width="400" height="150" rx="18" fill="#315A75" stroke="#63C5DA" stroke-width="4"/><text x="670.0" y="388" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">独立模块：依赖集束 TDB</text><text x="492" y="425" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">任务—关系—时间绑定</text><text x="492" y="452" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">状态向量与证据</text><text x="492" y="479" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">事件驱动生命周期</text><text x="492" y="506" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">Trace / Replay / HDBP</text><rect x="900" y="350" width="400" height="150" rx="18" fill="#243B72" stroke="#7AA2F7" stroke-width="4"/><text x="1100.0" y="388" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">模块二：决策与最小披露</text><text x="922" y="425" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">条件化世界 W_I</text><text x="922" y="452" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">鲁棒决策充分性</text><text x="922" y="479" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">minimax regret / risk budget</text><text x="922" y="506" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">最小披露前沿</text><rect x="1330" y="350" width="400" height="150" rx="18" fill="#243B72" stroke="#7AA2F7" stroke-width="4"/><text x="1530.0" y="388" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">模块三：证据与联合进化</text><text x="1352" y="425" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">计划—执行差异</text><text x="1352" y="452" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">依赖归因与反事实 Probe</text><text x="1352" y="479" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">组织/Agent/边/投影更新</text><text x="1352" y="506" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">跨任务验证与回滚</text><line x1="900" y1="280" x2="240" y2="350" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="900" y1="280" x2="670" y2="350" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="900" y1="280" x2="1100" y2="350" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="900" y1="280" x2="1530" y2="350" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="40" y="560" width="400" height="240" rx="18" fill="#245047" stroke="#52C49A" stroke-width="4"/><text x="240.0" y="598" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">世界模型内部</text><text x="62" y="635" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• 公共状态：任务、节点、进度、摘要</text><text x="62" y="662" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• 私人状态：Prompt、Memory、文件、凭据</text><text x="62" y="689" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• G_plan：冻结计划结构</text><text x="62" y="716" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• G_exec：真实事件轨迹</text><text x="62" y="743" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• 权限、交接义务、验收义务</text><text x="62" y="770" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• 证据、版本、风险、不确定性</text><rect x="470" y="560" width="400" height="270" rx="18" fill="#245047" stroke="#52C49A" stroke-width="4"/><text x="670.0" y="598" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">TDB 内部树</text><text x="492" y="635" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• Identity：taskId / edgeId / relationType</text><text x="492" y="662" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• Vector：data / logic / quality / freshness</text><text x="492" y="689" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• capability / resource / risk / impact</text><text x="492" y="716" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• Lifecycle：plan → active → exec</text><text x="492" y="743" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• Events：publish / consume / review / retry</text><text x="492" y="770" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• handoff / timeout / failure / versionChange</text><text x="492" y="797" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• replay token、trace hash、历史先验</text><rect x="900" y="560" width="400" height="270" rx="18" fill="#245047" stroke="#52C49A" stroke-width="4"/><text x="1100.0" y="598" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">决策模块内部树</text><text x="922" y="635" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• 初始观测与授权过滤</text><text x="922" y="662" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• support / safety / utility 检查</text><text x="922" y="689" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• W_I 上构造安全动作集合</text><text x="922" y="716" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• minimax regret 与风险筛选</text><text x="922" y="743" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• CERTIFIED / UNKNOWN / CONFLICT</text><text x="922" y="770" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• 选择最小披露单元</text><text x="922" y="797" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• 输出 selectedUnits、cost、claims、nextAction</text><rect x="1330" y="560" width="400" height="270" rx="18" fill="#245047" stroke="#52C49A" stroke-width="4"/><text x="1530.0" y="598" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">进化模块内部树</text><text x="1352" y="635" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• 真实事件、结果、义务</text><text x="1352" y="662" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• ΔTDB = active − plan</text><text x="1352" y="689" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• 候选原因：Agent、边、交接、版本、资源、组织</text><text x="1352" y="716" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• replaceAgent / changeEdge / refreshVersion</text><text x="1352" y="743" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• addReview / changeOrder / changeOrganization</text><text x="1352" y="770" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• Impact × Uncertainty × Risk × Coupling</text><text x="1352" y="797" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">• 验证、拒绝更新或回滚</text><line x1="240" y1="500" x2="240" y2="560" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="670" y1="500" x2="670" y2="560" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="1100" y1="500" x2="1100" y2="560" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="1530" y1="500" x2="1530" y2="560" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="300" y="930" width="1200" height="110" rx="18" fill="#694B1F" stroke="#F6AD55" stroke-width="4"/><text x="900.0" y="968" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">统一输出：公共语义投影与受控行动</text><text x="322" y="1005" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">claims + evidenceRefs + confidence + unknowns + nextAction</text><text x="322" y="1032" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">模型提出 proposal；独立 checker 负责权限、隐私、CERTIFIED 和演化资格</text><line x1="240" y1="830" x2="240" y2="930" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="670" y1="830" x2="670" y2="930" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="1100" y1="830" x2="1100" y2="930" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="1530" y1="830" x2="1530" y2="930" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="240" y1="830" x2="500" y2="930" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="670" y1="830" x2="750" y2="930" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="1100" y1="830" x2="1050" y2="930" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="1530" y1="830" x2="1300" y2="930" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="300" y="1130" width="1200" height="120" rx="18" fill="#384A5E" stroke="#90CDF4" stroke-width="4"/><text x="900.0" y="1168" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">闭环：执行 → 证据 → 归因 → Probe → 联合进化</text><text x="322" y="1205" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">更新组织结构、Agent 策略、依赖边规则和投影策略</text><text x="322" y="1232" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">在未见任务、Agent-pair、关系类型和故障组合上验证；不稳定则回滚</text><line x1="900" y1="1040" x2="900" y2="1130" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="420" y="1370" width="960" height="120" rx="18" fill="#7c2d12" stroke="#fb923c" stroke-width="4"/><text x="900.0" y="1408" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="24" font-weight="700" fill="white">当前代码边界</text><text x="442" y="1445" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">已实现：TDB/replay、decision sufficiency、disclosure frontier、Probe binding、归因与证据门</text><text x="442" y="1472" font-family="Arial,Microsoft YaHei" font-size="18" fill="white">仍待完成：方向加权训练层、统一两套 bundle contract、真实 gold 与真实跨任务进化证据</text><line x1="900" y1="1250" x2="900" y2="1370" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/></svg>